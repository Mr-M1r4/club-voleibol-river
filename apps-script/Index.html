<!DOCTYPE html>
<html>
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body {

      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.97); border-radius: 24px; padding: 40px;
      max-width: 500px; width: 100%; box-shadow: 0 25px 80px rgba(0,0,0,0.4);
      text-align: center;
    }
    .logo {
      width: 90px; height: 90px; background: #2E75B6; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; font-size: 42px; color: white;
    }
    h1 { color: #1a3a5c; font-size: 26px; margin-bottom: 5px; }
    .tagline { color: #888; font-size: 14px; margin-bottom: 30px; }
    .btn {
      display: block; width: 100%; padding: 16px; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 12px;
      transition: all 0.2s; text-decoration: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #2E75B6; color: white; }
    .btn-primary:hover { background: #1a5a8a; }
    .btn-success { background: #28a745; color: white; }
    .btn-success:hover { background: #1e7e34; }
    .btn-warning { background: #ffc107; color: #333; }
    .btn-warning:hover { background: #e0a800; }
    .btn-outline { background: transparent; color: #2E75B6; border: 2px solid #2E75B6; }
    .btn-outline:hover { background: #e8f0fe; }
    .divider { height: 1px; background: #e0e0e0; margin: 25px 0; }
    .footer { color: #aaa; font-size: 12px; margin-top: 25px; }

</head>

  <div class="card">

  <script>
    function abrirFormulario() {
      google.script.run
        .withSuccessHandler(function(id) {
          window.open('https://docs.google.com/forms/d/' + id + '/viewform', '_blank');
        })
        .withFailureHandler(function(err) {
          alert('Error al abrir el formulario: ' + err);
        })
        .obtenerOCrearFormularioRegistro();
    }
